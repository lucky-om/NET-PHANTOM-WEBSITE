name: Deploy Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Phantom AI API Key
        run: |
          if [ -n "${{ secrets.PHANTOM_API_KEY }}" ]; then
            sed -i "s/__PHANTOM_API_KEY__/${{ secrets.PHANTOM_API_KEY }}/g" script.js
            echo "API key injected successfully."
          else
            echo "Warning: PHANTOM_API_KEY secret not found. AI will run in local-only mode."
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
