name: Deploy Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API Key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.__GROQ_API_KEY__ }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            sed -i "s|__GROQ_API_KEY__|$GROQ_API_KEY|g" script.js
            echo "Successfully injected API key."
          else
            echo "WARNING: GROQ_API_KEY secret is not set!"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
