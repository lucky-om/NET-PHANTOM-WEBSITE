name: Deploy Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Phantom AI API Key
        run: |
          python3 -c "
          import os
          key = os.environ.get('PHANTOM_API_KEY', '')
          if key:
              with open('script.js', 'r') as f:
                  content = f.read()
              content = content.replace('__PHANTOM_API_KEY__', key)
              with open('script.js', 'w') as f:
                  f.write(content)
              print('API key injected successfully.')
          else:
              print('Warning: PHANTOM_API_KEY secret not found. AI will run in local-only mode.')
          "
        env:
          PHANTOM_API_KEY: ${{ secrets.PHANTOM_API_KEY }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
