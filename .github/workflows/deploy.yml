name: Deploy Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API Key
        env:
          KEY_1: ${{ secrets.GROQ_API_KEY }}
          KEY_2: ${{ secrets['__GROQ_API_KEY__'] }}
        run: |
          API_KEY="${KEY_1:-$KEY_2}"
          if [ -n "$API_KEY" ]; then
            sed -i "s|__GROQ_API_KEY__|$API_KEY|g" script.js
            echo "Successfully injected API key."
          else
            echo "WARNING: API key secret is not set!"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
